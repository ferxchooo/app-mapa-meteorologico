<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localizador Geográfico Global</title>
    <!-- CSS de Leaflet para el Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Localizador Geográfico Global</h1>
            <p>Consumo de API OpenStreetMap y Open-Meteo. Por Fernando Rodea Obregón</p>
            
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Ingresa una ciudad (ej. Toluca)">
                <button id="searchBtn">Consultar Clima y Mapa</button>
            </div>
        </header>

        <main class="content">
            <!-- Tarjeta de Clima -->
            <div class="card weather-card">
                <h2 id="cityName">Ciudad</h2>
                <p id="cityLocation" class="subtitle">Ubicación</p>
                
                <div class="weather-data">
                    <div class="data-row">
                        <span>Temperatura:</span>
                        <span id="tempValue">-- °C</span>
                    </div>
                    <hr>
                    <div class="data-row">
                        <span>Humedad:</span>
                        <span id="humValue">-- %</span>
                    </div>
                    <hr>
                    <div class="data-row">
                        <span>Condición:</span>
                        <span id="condValue">--</span>
                    </div>
                    <hr>
                    <div class="data-row">
                        <span>Coordenadas:</span>
                        <span id="coordValue">--</span>
                    </div>
                </div>
                
                <div id="statusMessage" class="status success">
                    Esperando consulta...
                </div>
            </div>

            <!-- Tarjeta de Mapa -->
            <div class="card map-card">
                <div id="map"></div>
            </div>
        </main>
    </div>

    <!-- JS de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
